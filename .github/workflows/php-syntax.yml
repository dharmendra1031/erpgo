name: PHP Syntax Check

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Validate composer.json
        run: composer validate --working-dir=main_file --no-check-publish

      - name: Lint application PHP files
        shell: bash
        run: |
          set -euo pipefail
          find main_file \
            -type f \
            -name '*.php' \
            -not -path '*/vendor/*' \
            -not -path '*/node_modules/*' \
            -print0 | xargs -0 -n1 php -l
